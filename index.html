<html lang="pt-BR"><head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dor torácica · UPA Guanambi</title>
<meta name="description" content="Protocolo de dor torácica e suspeita de infarto da UPA 24h de Guanambi-BA. Funciona sem internet.">
<meta name="theme-color" content="#0F4C5C">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dor torácica">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--tinta:#1E2329;--cinza:#5B6470;--linha:#DDE2E7;--fundo:#F4F6F8;--cartao:#FFFFFF;--marca:#D3085B;
  --verm:#C62828;--verm-f:#FDECEC;--lar:#B85400;--lar-f:#FFF1E3;--pet:#0F4C5C;--pet-f:#E7F1F3;--verde:#1B5E20;--verde-f:#E8F5E9;
  --sombra:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05)}
@media (prefers-color-scheme:dark){:root{--tinta:#E9EDF1;--cinza:#A7B0BA;--linha:#2C343C;--fundo:#11161B;--cartao:#1A2127;
  --verm:#FF6B6B;--verm-f:#2A1618;--lar:#FFA24D;--lar-f:#2B1E12;--pet:#5CC3D6;--pet-f:#12262B;--verde:#74D17B;--verde-f:#13251A;--sombra:none}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--tinta);
  padding-bottom:calc(72px + env(safe-area-inset-bottom))}
a{color:inherit}
.tarja{position:sticky;top:0;z-index:5;background:repeating-linear-gradient(135deg,#1E2329 0 10px,#3a4049 10px 20px);color:#fff;
  font:800 12px/1 system-ui,sans-serif;letter-spacing:.08em;text-align:center;padding:7px 12px}
.tarja b{background:#1E2329;padding:3px 8px;border-radius:4px}
header{background:var(--cartao);border-bottom:3px solid var(--marca);padding:14px 16px 12px;display:flex;align-items:center;gap:12px}
header h1{font-size:21px;line-height:1.1;font-weight:800;flex:1}
header h1 small{display:block;font-size:13px;font-weight:600;color:var(--cinza);margin-top:3px}
header img{height:26px;width:auto}
@media (prefers-color-scheme:dark){header img{filter:brightness(0) invert(1);opacity:.9}}
main{max-width:680px;margin:0 auto;padding:14px 14px 8px}
h2{font-size:22px;line-height:1.15;margin:6px 2px 12px;font-weight:800}
.sub{color:var(--cinza);font-size:14px;margin:-6px 2px 14px}
.lead{background:var(--pet);color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:14px}
@media (prefers-color-scheme:dark){.lead{background:#0F4C5C}}
.lead b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.9;margin-bottom:4px}
.rotas{display:grid;gap:10px;margin-bottom:14px}
.rota{display:flex;align-items:center;gap:14px;min-height:72px;border-radius:14px;padding:12px 16px;color:#fff;text-decoration:none;box-shadow:var(--sombra)}
.rota .num{flex:0 0 40px;height:40px;border-radius:50%;background:#fff;font:800 20px/40px system-ui,sans-serif;text-align:center}
.rota span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.92;font-weight:700}
.rota strong{display:block;font-size:20px;line-height:1.1}
.r1{background:#C62828}.r1 .num{color:#C62828}
.r2{background:#B85400}.r2 .num{color:#B85400}
.r3{background:#0F4C5C}.r3 .num{color:#0F4C5C}
.atalhos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.atalho{background:var(--cartao);border:1px solid var(--linha);border-radius:12px;min-height:56px;padding:10px 12px;font-weight:700;
  text-decoration:none;display:flex;align-items:center;gap:10px;box-shadow:var(--sombra)}
.atalho i{font-style:normal;font-size:20px}
.alerta{background:#1E2329;color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px}
@media (prefers-color-scheme:dark){.alerta{background:#000;border:1px solid #333}}
.alerta b{display:block;font-size:15px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.alerta .conf{color:#fff;border:1px solid #fff;border-radius:4px;padding:0 4px}
.card{background:var(--cartao);border-radius:12px;border-left:6px solid var(--pet);padding:12px 14px 12px;margin-bottom:10px;box-shadow:var(--sombra)}
.card h3{font-size:18px;line-height:1.2;margin-bottom:4px}
.card p{font-size:16px}
.card .fonte{font-size:12px;color:var(--cinza);margin-top:8px}
.card.c-r1{border-color:var(--verm)}.card.c-r2{border-color:var(--lar)}.card.c-r3{border-color:var(--pet)}
.card.desvio{border:2px dashed var(--cinza);border-left:6px solid var(--tinta)}
.card .pede{font-size:13px;color:var(--cinza);font-weight:600;margin-bottom:2px}
.card.alta{background:var(--verde-f);border-color:var(--verde)}
.card.pergunta{border-left-color:var(--tinta);background:var(--cartao)}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--cinza);border:1px solid currentColor;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.conf{font-weight:700;color:var(--cinza);font-size:14px}
.ligar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--cartao);border-radius:14px;padding:14px 16px;margin-bottom:10px;text-decoration:none;box-shadow:var(--sombra);border:1px solid var(--linha);min-height:64px}
.ligar b{font-size:16px}.ligar small{display:block;color:var(--cinza);font-size:13px;font-weight:500}
.ligar .n{font:800 22px/1 system-ui,sans-serif;color:var(--pet);white-space:nowrap}
.inst{background:var(--cartao);border:2px solid var(--pet);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.inst b{display:block;font-size:16px;margin-bottom:6px}
.inst ol{padding-left:22px}.inst li{margin:4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:12px;border:0;
  background:var(--pet);color:#fff;font:700 16px system-ui,sans-serif;cursor:pointer;margin-top:10px}
@media (prefers-color-scheme:dark){.btn{background:#0F4C5C}}
.btn.claro{background:transparent;color:var(--cinza);border:1px solid var(--linha)}
.novo{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:9;background:#1E2329;color:#fff;
  border-radius:12px;padding:12px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--cartao);border-top:1px solid var(--linha);display:grid;grid-template-columns:repeat(4,1fr);
  padding-bottom:env(safe-area-inset-bottom)}
nav a{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;font-size:12px;font-weight:700;color:var(--cinza)}
nav a i{font-style:normal;font-size:20px}
nav a[aria-current="page"]{color:var(--pet)}
.pe{font-size:12px;color:var(--cinza);line-height:1.5;margin:18px 2px 8px}
.pe p+p{margin-top:8px}
.oculto{display:none}
/* calculadora HEART: botões grandes, total fixo no alto enquanto rola */
.htotal{position:sticky;top:8px;z-index:4;display:flex;align-items:center;gap:12px;background:#0F4C5C;color:#fff;border-radius:12px;
  padding:10px 14px;margin:0 0 10px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tarja ~ main .htotal{top:34px}   /* com a tarja de rascunho, o total fica logo abaixo dela */
.htotal .hn{font:800 34px/1 system-ui,sans-serif;min-width:44px;text-align:center}
.htotal .hx{font-size:15px;line-height:1.3}
.calc{background:var(--cartao);border-radius:12px;border-left:6px solid var(--pet);padding:12px 14px;margin-bottom:10px;box-shadow:var(--sombra)}
.hitem+.hitem{margin-top:14px}
.hrot{font-size:16px;font-weight:700;margin-bottom:6px}.hrot b{display:inline-block;min-width:22px;color:var(--pet)}
.hops{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hop{min-height:64px;border:1px solid var(--linha);border-radius:10px;background:var(--fundo);color:var(--tinta);font:600 13px/1.25 system-ui,sans-serif;
  padding:6px 5px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;text-align:center}
.hop b{font-size:20px;line-height:1}
.hop[aria-checked="true"]{background:#0F4C5C;color:#fff;border-color:#0F4C5C}
.hnota{font-size:13px;color:var(--cinza);margin-top:6px}
.card.foco{outline:3px solid var(--tinta);outline-offset:2px}
/* revisar: sugestões, perguntas em aberto e percepção — a única tela com campo de texto */
.sugerir{display:inline-block;font-size:13px;font-weight:700;color:var(--pet);text-decoration:none;margin-top:6px;padding:6px 0}
.rev-aviso{background:var(--lar-f);border-left:6px solid var(--lar);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.rev-aviso b{display:block;margin-bottom:2px}
.rev-info{background:var(--pet-f);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:15px}
.papeis{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{min-height:44px;padding:0 13px;border-radius:99px;border:1px solid var(--linha);background:var(--cartao);color:var(--tinta);
  font:600 14px system-ui,sans-serif;cursor:pointer}
.chip[aria-checked="true"]{background:#0F4C5C;color:#fff;border-color:#0F4C5C}
.campo{display:block;width:100%;font:16px/1.4 system-ui,sans-serif;padding:10px 12px;border:1px solid var(--linha);border-radius:10px;
  background:var(--cartao);color:var(--tinta)}
textarea.campo{min-height:96px;resize:vertical}
.rotulo{display:block;font-size:14px;font-weight:700;margin:10px 0 4px}
.estado-envio{font-size:14px;margin-top:8px;min-height:1.2em}
.estado-envio.ok{color:var(--verde);font-weight:700}.estado-envio.erro{color:var(--verm);font-weight:700}
details.perg{background:var(--cartao);border-radius:12px;margin-bottom:8px;box-shadow:var(--sombra);border-left:6px solid var(--pet)}
details.perg summary{padding:12px 14px;cursor:pointer;font-weight:700;line-height:1.3}
details.perg .corpo{padding:0 14px 14px}
details.perg .hoje{font-size:14px;color:var(--cinza);margin-bottom:8px}
.grupo-t{font-size:18px;margin:18px 2px 8px}
.nota5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:4px 0 10px}
.nota5 .chip{padding:0;border-radius:10px}
</style>
</head>

<script>
var D = {"cab":{"titulo":"Dor torácica · suspeita de infarto","subtitulo":"UPA 24h de Guanambi-BA","versao":"0.9 · 24/09/2026","validacao_1":"Validação técnica — cardiologista","validacao_2":"Aprovação — direção da UPA","fontes":"Fontes — Diretriz Brasileira de Atendimento à Dor Torácica na Unidade de Emergência, SBC 2025 (Arq Bras Cardiol. 2025;122(9):e20250620) · Portaria GM/MS nº 2.994/2011 (Linha de Cuidado do IAM e Protocolo de SCA) · Coleta de campo PIEPE VII na UPA, 24/08 a 11/09/2026 (1.493 registros)."},"caixas":[{"id":"CX-G1","rota":"gatilho","tipo":"info","titulo":"Abra o protocolo se","texto":"Dor ou desconforto torácico. Também sem dor: dispneia, síncope ou mal-estar em idoso ou diabético — 10 a 30% das síndromes coronarianas agudas chegam sem dor torácica.","fonte":"SBC 2025, §3.1","a3":"Dor ou desconforto no peito — ou, sem dor, dispneia, síncope ou mal-estar em idoso ou diabético."},{"id":"CX-G2","rota":"gatilho","tipo":"acao","titulo":"Classifique vermelho ou laranja","texto":"No Manchester, dor torácica suspeita de SCA entra como vermelho ou laranja, e nos dois casos o ECG é feito nos primeiros 10 minutos. A dor atípica também.","fonte":"SBC 2025, §3.1","veredito":"DEPENDE DE LACUNA","a3":"Dor torácica suspeita — também a atípica — é vermelho ou laranja."},{"id":"CX-G3","rota":"gatilho","tipo":"acao","titulo":"ECG de 12 derivações em até 10 min","texto":"ECG de 12 derivações em até 10 minutos da chegada, rodado pela enfermagem, que leva o traçado ao médico. Não espere a consulta para rodar o ECG.","fonte":"SBC 2025, §3.3.1 e Tabela 1","veredito":"DEPENDE DE LACUNA","a3":"A enfermagem roda sem esperar o médico e leva o traçado a ele."},{"id":"CX-G4","rota":"gatilho","tipo":"acao","titulo":"Anote a hora à mão no traçado","texto":"Escreva a caneta, no próprio traçado, a hora de chegada e a hora em que o ECG saiu. A coleta encontrou relatos de hora e data erradas impressas pelo aparelho, e o tempo porta-ECG é indicador que a diretriz manda monitorar.","fonte":"SBC 2025, §5.2.5 (tempo porta-ECG); FICHA ECG-HORA","veredito":"EXECUTÁVEL","a3":"Chegada e ECG, a caneta: o relógio do aparelho erra."},{"id":"CX-G5","rota":"gatilho","tipo":"acao","titulo":"MOV","texto":"Monitorização, saturação de O₂ (oxigênio só se SatO₂ < 90%, congestão, dispneia ou cianose) e acesso venoso com coleta de sangue. Obrigatório se a dor persiste ou há qualquer critério de instabilidade.","fonte":"SBC 2025, fluxograma central (p. 25); Portaria 2.994/2011, Protocolo SCA §2.1","veredito":"DEPENDE DE LACUNA","a3":"Monitor · SatO₂ (O₂ só se < 90%) · acesso venoso com coleta."},{"id":"CX-G6","rota":"gatilho","tipo":"acao","titulo":"Mande o ECG ao telelaudo","texto":"Envie o traçado ao telelaudo (HCor). A leitura do médico da UPA vem primeiro: não espere o laudo para decidir um supra.","fonte":"Portaria 2.994/2011, objetivo 6 (telemedicina nas UPAs)","veredito":"DEPENDE DE LACUNA","a3":"HCor. Leia você mesmo: não espere o laudo."},{"id":"CX-D1","rota":"alerta","tipo":"alerta","titulo":"Antes de antiagregar: pense em dissecção","texto":"Antes de qualquer antiagregante ou anticoagulante, some o ADD-RS — 1 ponto por grupo presente: condição predisposta (Marfan ou outra doença do tecido conjuntivo, história familiar de aortopatia, valvopatia aórtica, manipulação aórtica recente, aneurisma de aorta torácico conhecido); dor de início súbito, intensa ou \"rasgando\"; exame com déficit de pulso ou de pressão, déficit neurológico focal, sopro de regurgitação aórtica novo, hipotensão ou choque. ADD-RS ≥ 2, ou sinal sugestivo na radiografia (mediastino alargado): alta probabilidade — NÃO antiagregue nem anticoagule e regule já para angiotomografia de aorta. ADD-RS ≤ 1 e radiografia sem sinais: baixa probabilidade; a SBC descarta com D-dímero < 500 ng/ml. Na dissecção, antiagregar ou anticoagular é contraindicado e deletério; a letalidade é de cerca de 50% em 48 horas sem diagnóstico. Nenhum escore sozinho define ou descarta. [CONFERIR na validação: sem D-dímero na UPA, ADD-RS ≤ 1 com radiografia sem sinais basta para antiagregar]","fonte":"SBC 2025, p. 13 (diferenciais), §4.2.2, Tabela 16 e Figura 9","a3":"ADD-RS ≥ 2 ou mediastino alargado? NÃO dê AAS, clopidogrel nem anticoagulante: regule para imagem de aorta. ADD-RS ≤ 1 e RX sem sinais: siga a rota da SCA."},{"id":"CX-P1","rota":"pergunta","tipo":"pergunta","titulo":"Supra de ST ou equivalente?","texto":"Elevação nova do segmento ST, medida no ponto J, em pelo menos 2 derivações contíguas: ≥ 1 mm nas derivações em geral; em V2 e V3, ≥ 2,5 mm em homem com menos de 40 anos, ≥ 2 mm em homem com 40 anos ou mais e ≥ 1,5 mm em mulher. Em V7–V9, V3R e V4R, ≥ 0,5 mm. Com bloqueio de ramo esquerdo: elevação concordante ≥ 1 mm, depressão concordante ≥ 1 mm em V1–V3 ou elevação discordante ≥ 5 mm (Sgarbossa). BRE novo isolado não é mais critério. Equivalentes de oclusão, tratados como supra: infarto posterior (infra de ST, T positiva terminal ou R ampla em V1–V3; confirme com ≥ 0,5 mm em V7–V9), De Winter, ondas T hiperagudas (repita o ECG em intervalos curtos), padrão de Aslanger e distorção terminal do QRS. Supra inferior: faça V3R e V4R (infarto de VD).","fonte":"SBC 2025, Tabela 7; Portaria 2.994/2011 (derivações do ECG)","a3":"Supra novo no ponto J em 2 derivações contíguas: ≥ 1 mm · em V2–V3: ≥ 2,5 mm homem < 40 a, ≥ 2 mm homem ≥ 40 a, ≥ 1,5 mm mulher. BRE: Sgarbossa. Equivalente também é rota 1: infra em V1–V3 (faça V7–V9), De Winter, T hiperaguda."},{"id":"CX-V1","rota":"supra","tipo":"acao","titulo":"AAS 200 mg","texto":"AAS 200 mg mastigado — 2 comprimidos de 100 mg (a apresentação da farmácia). A dose de ataque é 160 a 325 mg; no Brasil a usual é 200 mg.","fonte":"Portaria 2.994/2011, Protocolo SCA §2.3","veredito":"EXECUTÁVEL","grupo":"Antiagregue — depois de afastar dissecção","a3":"2 comprimidos de 100 mg, mastigados."},{"id":"CX-V2","rota":"supra","tipo":"acao","titulo":"Clopidogrel","texto":"A dose de ataque segue a estratégia de reperfusão que a central define na ligação da vaga zero: ICP primária, 600 mg (8 comprimidos de 75 mg); trombólise no destino ou sem reperfusão, 300 mg (4 comprimidos de 75 mg). Com 75 anos ou mais: apenas 75 mg, sem dose de ataque. [CONFERIR na validação: dose quando a central ainda não definiu a estratégia]","fonte":"Portaria 2.994/2011, Protocolo SCA §2.4","veredito":"DEPENDE DE LACUNA","grupo":"Antiagregue — depois de afastar dissecção","a3":"dose pela estratégia que a central definir — ICP primária 600 mg (8 × 75) · trombólise ou sem reperfusão 300 mg (4 × 75) · 75 anos ou mais: 75 mg, sem ataque."},{"id":"CX-V3","rota":"supra","tipo":"acao","titulo":"Vaga zero agora","texto":"Peça vaga zero imediatamente: o plantonista liga para o médico regulador da central (SUREM) e registra no sistema. Troponina não entra nesta decisão. Cada 30 minutos de atraso na reperfusão aumenta a mortalidade em 7,5%.","fonte":"SBC 2025, §5.1.2; Portaria 2.994/2011, §1 (isquemia total ≤ 120 min)","veredito":"EXECUTÁVEL","ordem":"2","a3":"O plantonista liga para o médico regulador (SUREM). Não espere troponina."},{"id":"CX-V4","rota":"supra","tipo":"acao","titulo":"Trombólise em até 30 min","texto":"A norma espera trombólise na UPA quando a ICP não está disponível (porta-agulha < 30 min). Esta UPA não tem trombolítico: a reperfusão acontece no destino, e o tempo da UPA passa a ser o tempo até a saída da ambulância.","fonte":"Portaria 2.994/2011, §1 (porta-agulha < 30 min; até 3 h de dor, trombolítico no local se ICP indisponível)","veredito":"IMPOSSÍVEL AQUI","desvio":"Sem trombolítico aqui: transfira já","ordem":"1","a3":"Cada 30 min de atraso = +7,5% de mortalidade."},{"id":"CX-V5","rota":"supra","tipo":"acao","titulo":"SAMU avançado","texto":"Transporte pelo SAMU de suporte avançado. Vão com o paciente a cópia do ECG, os exames e o relatório médico.","fonte":"Portaria 2.994/2011 (componente Serviço móvel pré-hospitalar — SAMU); FICHA-DA-UPA (SAMU-AVANCADA)","veredito":"EXECUTÁVEL","a3":"SAMU 192, suporte avançado. Vão juntos: cópia do ECG, exames e relatório."},{"id":"CX-V6","rota":"supra","tipo":"acao","titulo":"Dor que continua","texto":"Nitrato sublingual (dinitrato de isossorbida 5 mg), repetido até 3 vezes a cada 5 minutos. Contraindicado com PAS < 90 mmHg, FC < 50 bpm, IAM de ventrículo direito (no supra inferior, faça V3R e V4R antes do nitrato), sildenafil nas últimas 24 h, tadalafil nas últimas 48 h ou vardenafil (sem tempo definido). Sem alívio com o nitrato: morfina 2 a 4 mg IV a cada 5 a 15 minutos, se necessário.","fonte":"Portaria 2.994/2011, Protocolo SCA §2.1 e §2.2","veredito":"DEPENDE DE LACUNA","a3":"Dinitrato 5 mg SL, até 3× a cada 5 min. NÃO se PAS < 90, FC < 50, IAM de VD (inferior: V3R/V4R antes), sildenafil 24 h, tadalafil 48 h, vardenafil. Sem alívio: morfina 2–4 mg IV."},{"id":"CX-V7","rota":"supra","tipo":"info","titulo":"Anticoagulante","texto":"A Portaria amarra o anticoagulante à estratégia de reperfusão (adjuvante da trombólise, ou da estratégia conservadora), e a estratégia é decidida no destino. Combine com o médico regulador antes de anticoagular. [CONFERIR na validação: anticoagular na UPA antes da transferência?]","fonte":"Portaria 2.994/2011, Protocolo SCA (anticoagulação)"},{"id":"CX-P2","rota":"pergunta","tipo":"pergunta","titulo":"Instabilidade ou alto risco?","texto":"Critérios de instabilidade: ECG limítrofe, dor persistente, instabilidade hemodinâmica ou má perfusão, congestão pulmonar aguda, taquiarritmia ou bradiarritmia no contexto da dor. Vão para a mesma rota o ECG de alto risco sem supra (Tabela 7: depressão do ST horizontal ou descendente ≥ 0,5 mm em 2 ou mais derivações contíguas; síndrome de Wellens — T bifásica ou profundamente invertida em V2–V3; supra em aVR e/ou V1 com depressão do ST em 6 ou mais derivações) e a troponina positiva com quadro compatível.","fonte":"SBC 2025, fluxograma central (passo 2) e Tabela 7","a3":"ECG limítrofe ou de alto risco (infra ≥ 0,5 mm, Wellens, supra em aVR com infra difuso) · troponina positiva · dor persistente · instabilidade hemodinâmica ou má perfusão · congestão pulmonar · taqui ou bradiarritmia."},{"id":"CX-L1","rota":"instavel","tipo":"acao","titulo":"ECG a cada 10–20 min","texto":"Sala vermelha, monitor contínuo e ECG repetido a cada 10 a 20 minutos enquanto houver sintoma, ECG duvidoso ou instabilidade. Apoio de médico experiente.","fonte":"SBC 2025, passo 4 (rota do instável)","veredito":"DEPENDE DE LACUNA","grupo":"Na sala vermelha","a3":"Monitor contínuo, enquanto houver sintoma."},{"id":"CX-S1","rota":"semsupra","tipo":"acao","titulo":"Sem supra: só AAS até esclarecer","texto":"Sem supra e sem diagnóstico fechado (instável ou estável), trate a suspeita de SCA apenas com AAS até esclarecer — 200 mg, 2 comprimidos de 100 mg mastigados — na ausência de contraindicação ou risco de sangramento, e depois de afastar dissecção. Confirmada a SCA sem supra (troponina positiva com quadro compatível, ou ECG de alto risco), acrescente clopidogrel 300 mg — veja \"SCA sem supra confirmada\".","fonte":"SBC 2025 (terapia antes do diagnóstico — DOSSIE §2.5); Portaria 2.994/2011, Protocolo SCA §2.3","veredito":"DEPENDE DE LACUNA","a3":"200 mg = 2 × 100 mg mastigados, após afastar dissecção. Confirmou SCA sem supra: + clopidogrel 300 mg (4 × 75)."},{"id":"CX-L3","rota":"instavel","tipo":"acao","titulo":"Troponina agora","texto":"Colha a troponina já. O laboratório é externo (VIDAS): o resultado demora, então a troponina não pode segurar a decisão de regular o paciente instável.","fonte":"SBC 2025, passo 2 (rota do instável); FICHA-DA-UPA (laboratório externo)","veredito":"EXECUTÁVEL","grupo":"Na sala vermelha","a3":"Laboratório externo: não segure o instável esperando o resultado."},{"id":"CX-L4","rota":"instavel","tipo":"acao","titulo":"Procure os 6 que matam","texto":"Busca ativa dos diferenciais letais: SCA, dissecção de aorta, TEP, tamponamento, pneumotórax hipertensivo e ruptura de esôfago. Propedêutica: anamnese, exame físico (pulsos e pressão nos dois braços), ECG e radiografia de tórax.","fonte":"SBC 2025, seção de instabilidade (diferenciais e propedêutica)","veredito":"DEPENDE DE LACUNA","a3":"SCA · dissecção · TEP · tamponamento · pneumotórax hipertensivo · ruptura de esôfago. PA nos 2 braços + RX de tórax."},{"id":"CX-L5","rota":"instavel","tipo":"acao","titulo":"POCUS à beira do leito","texto":"A diretriz trata o POCUS como ferramenta essencial no instável. A unidade não tem ultrassom próprio: apoie-se em exame físico, radiografia e ECG seriado, e peça a vaga cedo.","fonte":"SBC 2025, seção de instabilidade (POCUS)","veredito":"IMPOSSÍVEL AQUI","desvio":"Sem ultrassom aqui: exame, RX e ECG seriado","a3":"E regule cedo."},{"id":"CX-L6","rota":"instavel","tipo":"acao","titulo":"Regule","texto":"Peça vaga pela central de regulação (SUREM). A diretriz considera cumprido o acesso à hemodinâmica 24/7 quando ele existe por sistema integrado de referenciamento — é o caso aqui.","fonte":"SBC 2025, recomendação I/C (hemodinâmica no serviço ou por referenciamento — DOSSIE §2.4)","veredito":"EXECUTÁVEL","a3":"Peça a vaga pela central (SUREM), sem esperar a troponina."},{"id":"CX-L7","rota":"instavel","tipo":"acao","titulo":"SCA sem supra confirmada","texto":"Com SCA sem supra confirmada (troponina positiva com quadro compatível, ou ECG de alto risco), a Portaria dá clopidogrel 300 mg — 4 comprimidos de 75 mg; considerar 600 mg se a estratégia for invasiva precoce — e, com 75 anos ou mais, apenas 75 mg, sem ataque. A Portaria prevê anticoagulação (HNF por 48 h ou enoxaparina por 8 dias): combine com o médico regulador antes de começar na UPA. [CONFERIR na validação: clopidogrel e anticoagulante na UPA, na SCA sem supra, antes da transferência?]","fonte":"Portaria 2.994/2011, Protocolo SCA (clopidogrel e anticoagulação na SCASSST)","veredito":"DEPENDE DE LACUNA"},{"id":"CX-A2","rota":"estavel","tipo":"acao","titulo":"Troponina 0 h e a cada 3 h","texto":"Troponina quantitativa na chegada e a cada 3 horas, até ter uma amostra colhida mais de 6 a 12 horas após o início dos sintomas (o tempo depende do kit). A daqui não é de alta sensibilidade (confirmar o kit no laudo): negativa depois desse intervalo do último episódio de dor pode afastar infarto. Dor recorrente ou alta suspeita: colha troponinas adicionais. Os esquemas 0/1 h, 0/2 h e 0/3 h da diretriz são da troponina de alta sensibilidade. Positiva: acima do valor de referência do laudo.","fonte":"SBC 2025, §4.3.1.5 e §4.3.1.6","veredito":"DEPENDE DE LACUNA","ordem":"1","a3":"Convencional: repita até 6–12 h da dor. Acima da referência do laudo = positiva."},{"id":"CX-A3","rota":"estavel","tipo":"acao","titulo":"A cada 15–30 min","texto":"Sinais vitais a cada 15 a 30 minutos. Se a dor voltar ou mudar, novo ECG imediatamente e reavalie a rota.","fonte":"SBC 2025, §4.3","veredito":"DEPENDE DE LACUNA","grupo":"Em observação","ordem":"2","a3":"sinais vitais. Dor voltou ou mudou? ECG de novo."},{"id":"CX-A4","rota":"estavel","tipo":"acao","titulo":"Some","texto":"Some 0 a 2 pontos em cada: História (pouco, moderada ou altamente suspeita), ECG (normal, repolarização inespecífica, depressão significativa de ST), Idade (< 45, 45 a 64, 65 ou mais), Risco (nenhum fator, 1 ou 2, 3 ou mais ou doença aterosclerótica) e Troponina convencional (até o limite, 1 a 3 vezes, 3 vezes ou mais).","fonte":"SBC 2025, Tabela 14, §4.2.1 e §4.2.1.1","veredito":"DEPENDE DE LACUNA","grupo":"Escore HEART","heart_h":"História | pouco ou nada suspeita | moderadamente suspeita | altamente suspeita","heart_e":"ECG | normal | repolarização inespecífica | depressão significativa de ST","heart_a":"Idade | menos de 45 anos | 45 a 64 anos | 65 anos ou mais","heart_r":"Risco | nenhum fator | 1 ou 2 fatores | 3 ou mais, ou doença aterosclerótica","heart_t":"Troponina (com valor no laudo) | até o limite superior | 1 a 3 × o limite | 3 × o limite ou mais | laudo sem valor (só + ou −)","heart_fatores":"hipertensão, hipercolesterolemia, diabetes, obesidade (IMC > 30), tabagismo atual ou parado há 3 meses ou menos, história familiar precoce (1º grau).","heart_quando":"Na rota 3, na hora de decidir se é seguro liberar. ECG ou troponina já diagnósticos, com quadro compatível, não precisam de HEART: siga a rota de tratamento. O T pede troponina com valor e limite no laudo — só positivo/negativo não pontua 1 × 2.","heart_faixas":"0–3 risco baixo | 4–6 risco médio | 7–10 risco elevado","heart_desfecho":"de evento cardiovascular maior em 6 semanas","heart_sem_valor":"Com laudo só positivo/negativo o T não é pontuável e o HEART não fecha: não use o escore para dar alta — siga a observação e fale com o regulador.","a3":"História · ECG · Idade · Risco · Troponina — 0 a 2 pontos cada."},{"id":"CX-A5","rota":"estavel","tipo":"acao","titulo":"0–3","texto":"HEART de 0 a 3 (risco baixo), sem antecedente de doença coronária, ECG sem alteração isquêmica e troponina convencional negativa colhida 6 a 12 horas depois do último episódio de dor (conforme o kit): considerar alta, com encaminhamento para investigação ambulatorial precoce.","fonte":"SBC 2025, Figura Central, §4.2.1 e §4.3.2.1; DOSSIE §2.5","veredito":"DEPENDE DE LACUNA","destaque":"alta","grupo":"Escore HEART","a3":"sem coronariopatia prévia, ECG sem isquemia, troponina negativa 6–12 h após a última dor: considerar alta e encaminhar cedo."},{"id":"CX-A6","rota":"estavel","tipo":"info","titulo":"4–6 · 7–10","texto":"HEART de 4 a 6 (risco médio de evento cardiovascular maior em 6 semanas): observação e investigação adicional — terceira troponina, novo ECG com derivações complementares e revisão dos diagnósticos diferenciais. HEART de 7 a 10 (risco elevado): a diretriz dá o estrato, não a conduta; não libere e discuta vaga com a central. [CONFERIR na validação: conduta de 7 a 10]","fonte":"SBC 2025, §4.2.1, Tabela 28 e Figura Central","grupo":"Escore HEART","a3":"4–6: observe; 3ª troponina e ECG com derivações complementares. 7–10: não libere; discuta vaga. [CONFERIR 7–10]"},{"id":"CX-A7","rota":"estavel","tipo":"info","titulo":"Mudou de rota?","texto":"Troponina positiva (acima do valor de referência) ou ECG que mudou tiram o paciente desta rota: reavalie supra e instabilidade.","fonte":"SBC 2025, §4.3 e fluxograma central","grupo":"Em observação","ordem":"3","a3":"troponina positiva ou ECG novo → rota 2 ou 1."},{"id":"CX-C1","rota":"contatos","tipo":"acao","titulo":"Regulação — SUREM","texto":"Central estadual de regulação (SUREM), Salvador: (71) 3118-8200. Vaga zero: o plantonista fala direto com o médico regulador.","fonte":"FICHA REGULACAO-TELEFONE","veredito":"EXECUTÁVEL","a3":"(71) 3118-8200","tel":"+557131188200"},{"id":"CX-C2","rota":"contatos","tipo":"acao","titulo":"SAMU","texto":"SAMU: 192. Transferência de infarto com suporte avançado.","fonte":"FICHA SAMU-AVANCADA","veredito":"EXECUTÁVEL","a3":"192","tel":"192"},{"id":"CX-C3","rota":"contatos","tipo":"acao","titulo":"Telelaudo de ECG","texto":"Telelaudo HCor, pelo sistema ligado ao eletrocardiógrafo. O cardiologista de plantão pode contatar a UPA na suspeita de infarto.","fonte":"FICHA TELELAUDO","veredito":"DEPENDE DE LACUNA","a3":"HCor — pelo sistema do eletrocardiógrafo."}],"perguntas":[{"id":"CLOPIDOGREL-75","para":"equipe","texto":"Qual a apresentação do clopidogrel na farmácia (75 mg? há 300 mg)?","trava":["CX-V2","CX-S1","CX-L7"],"hoje":"A coleta registrou: a apresentação do clopidogrel é 75 mg — relato de uma visita só."},{"id":"TROP-NAO-HS","para":"equipe","texto":"Qual é o kit de troponina do laboratório (VIDAS) e qual valor de referência (percentil 99) sai no laudo? Ele é de alta sensibilidade?","trava":["CX-A2","CX-A4","CX-A5"],"hoje":"A coleta registrou: a troponina disponível NÃO é de alta sensibilidade — ainda não confirmado (respostas divergentes ou insuficientes)."},{"id":"TROP-QUALI-PRIMEIRO","para":"equipe","texto":"O laudo da troponina vem com número e valor de referência, ou só positivo/negativo? Existe a quantitativa direto?","trava":["CX-A2","CX-A4","CX-A5"],"hoje":"A },{"id":"CX-V7","para":"cardiologista","trava":["CX-V7"],"texto":"Anticoagulante — Anticoagular na UPA antes da transferência?","hoje":"O protocolo diz hoje: A Portaria amarra o anticoagulante à estratégia de reperfusão (adjuvante da trombólise, ou da estratégia conservadora), e a estratégia é decidida no destino. Combine com o médico regulador antes de anticoagular."},{"id":"CX-L7","para":"cardiologista","trava":["CX-L7"],"texto":"SCA sem supra confirmada — Clopidogrel e anticoagulante na UPA, na SCA sem supra, antes da transferência?","hoje":"O protocolo diz hoje: Com SCA sem supra confirmada (troponina positiva com quadro compatível, ou ECG de alto risco), a Portaria dá clopidogrel 300 mg — 4 comprimidos de 75 mg; considerar 600 mg se a estratégia for invasiva precoce — e, com 75 anos ou mais, apenas 75 mg, sem ataque. A Portaria prevê anticoagulação (HNF por 48 h ou enoxaparina por 8 dias): combine com o médico regulador antes de começar na UPA."},{"id":"CX-A6","para":"cardiologista","trava":["CX-A6"],"texto":"Escore HEART 4–6 · 7–10 — Conduta de 7 a 10?","hoje":"O protocolo diz hoje: 4–6: observe; 3ª troponina e ECG com derivações complementares. 7–10: não libere; discuta vaga."},{"id":"ESPERA-TRANSFERENCIA","para":"cardiologista","texto":"Entre a ligação para a central e a saída do SAMU, e quando a central nega a vaga, o que a UPA deve fazer com o infarto com supra?","hoje":"A rota 1 termina em \"vaga zero agora\" e \"SAMU avançado\". Não há caixa para a espera nem para a vaga negada; a coleta relata espera \"de minutos a horas\" e negativa \"fora da janela de tratamento\".","trava":["CX-V3","CX-V5"]},{"id":"TRAVA-ALTA-HEART","para":"cardiologista","texto":"Se o laudo da troponina vier só positivo/negativo, o app deve travar o \"considerar alta\" do HEART até haver troponina com valor, seriada?","hoje":"O app avisa no alto e no total, mas não trava.","trava":["CX-A4","CX-A5"]},{"id":"OBSERVACAO-6-12H","para":"direcao","texto":"Dá para manter um paciente estável de 6 a 12 horas em observação, com a troponina laudada fora? Em quantos leitos?","hoje":"A rota 3 assume observação até a troponina passar de 6–12 h do início da dor, com coleta a cada 3 h.","trava":["CX-A2","CX-A5"]},{"id":"NORMA-ADOCAO","para":"direcao","texto":"Quem adota este protocolo como norma da UPA (número de POP, cargos que assinam, data de revisão)? E o POP que já existe no computador da enfermagem é revogado ou fundido com este?","hoje":"Os dois campos de assinatura (cardiologista e direção) estão no A3, em branco.","trava":[]},{"id":"ENFERMAGEM-AUTORIDADE","para":"enfermagem","texto":"Este documento basta para a enfermagem rodar o ECG sem pedido médico e classificar a dor torácica atípica como vermelho ou laranja? Ou isso precisa de ato próprio da UPA ou da SESAB?","hoje":"O protocolo manda ECG em até 10 minutos pela enfermagem e vermelho ou laranja também na dor atípica.","trava":["CX-G2","CX-G3"]},{"id":"MANUTENCAO","para":"direcao","texto":"Depois de novembro, quem fica responsável por manter o protocolo e o app corretos (telefones, diretriz nova) e em que data ele é revisado?","hoje":"O projeto termina em 07/11 e não há responsável nem data de revisão.","trava":[]},{"id":"D-DIMERO","para":"equipe","texto":"O laboratório que atende a UPA faz D-dímero? Em quanto tempo sai o resultado, de dia e de madrugada?","hoje":"A SBC descarta dissecção de baixa probabilidade (ADD-RS ≤ 1, radiografia sem sinais) com D-dímero abaixo de 500 ng/ml; a coleta não perguntou sobre D-dímero.","trava":["CX-D1"]}],"canal":{"url":"","papeis":[["medico","Médico(a) da UPA"],["enfermagem","Enfermagem"],["cardiologista","Cardiologista"],["direcao","Direção ou coordenação"],["estudante","Estudante do PIEPE"],["outro","Outro"]],"grupos":[["equipe","Para a equipe da UPA"],["cardiologista","Para o cardiologista"],["enfermagem","Para a coordenação de enfermagem"],["direcao","Para a direção da UPA"]],"percepcao":["clareza","segurança","aplicabilidade","utilidade","facilidade de adesão"],"prazo":"15/10/2026"}};
var VERSAO_APP = '29b72da2';
var $ = function (s) { return document.querySelector(s); };
var CX = {}; D.caixas.forEach(function (c) { CX[c.id] = c; });
function esc(t) { return String(t || '').replace(/[&<>"]/g, function (m) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }
/* Marcas de rascunho ([CONFERIR], ◇) só com `estado:` na FONTE (tarja). Sem ele, as pendências vivem na tela Revisar. */
var RASCUNHO = !!D.cab.estado;
function rico(t) { return RASCUNHO ? esc(t).replace(/\[CONFERIR[^\]]*\]/g, function (m) { return '<span class="conf">' + m + '</span>'; })
                                   : esc(String(t || '').replace(/\s*\[CONFERIR[^\]]*\]/g, '')); }
function daRota(r) { return D.caixas.filter(function (c) { return c.rota === r; })
  .sort(function (a, b) { return ((+a.ordem || 50) - (+b.ordem || 50)) || (D.caixas.indexOf(a) - D.caixas.indexOf(b)); }); }
var COR = { supra: 'c-r1', instavel: 'c-r2', estavel: 'c-r3', semsupra: 'c-r2', gatilho: 'c-r3', contatos: 'c-r3' };

function card(c) {
  var cls = 'card ' + (COR[c.rota] || '') + (c.tipo === 'pergunta' ? ' pergunta' : '') + (c.destaque === 'alta' ? ' alta' : '');
  var tag = RASCUNHO && c.veredito === 'DEPENDE DE LACUNA' ? '<span class="tag">◇ a confirmar com a equipe</span>' : '';
  var fonte = '<div class="fonte">Fonte: ' + esc(c.fonte) + '</div><a class="sugerir" href="#/revisar/' + c.id + '">✎ Sugerir mudança</a>';
  if (c.veredito === 'IMPOSSÍVEL AQUI')
    return '<div class="card desvio" data-cx="' + c.id + '"><div class="pede">A diretriz pede: ' + esc(c.titulo) +
      ' — indisponível nesta UPA</div><h3>' + esc(c.desvio) + '</h3><p>' + rico(c.texto) + '</p>' + fonte + '</div>';
  return '<div class="' + cls + '" data-cx="' + c.id + '"><h3>' + esc(c.titulo) + tag + '</h3><p>' + rico(c.texto) + '</p>' + fonte + '</div>';
}
/* Nas rotas, o alerta vai curto (o texto da parede): a conduta precisa aparecer sem rolar.
   O texto completo fica em "Os 6 que matam". */
function alerta(completo) { var a = CX['CX-D1'];
  return '<div class="alerta" data-cx="CX-D1"><b>⚠ ' + esc(a.titulo) + '</b>' + rico(completo ? a.texto : a.a3) +
    (completo ? '' : ' <a href="#/matam" style="color:#fff;font-weight:700">Mais</a>') + '</div>'; }
function tel(c) { return c.tel ? 'tel:' + c.tel : null; }

/* Calculadora HEART: só toques, só na memória. Nada é gravado nem enviado; sair da tela zera.
   Itens, faixas e texto vêm da CX-A4 da FONTE (Tabela 14 da SBC); aqui só se soma. */
var HEART = ['h', 'e', 'a', 'r', 't'];
var FAIXAS = String(CX['CX-A4'].heart_faixas || '').split('|').map(function (f) {
  f = f.trim(); var i = f.indexOf(' '), lim = f.slice(0, i).split('–');
  return { de: +lim[0], ate: +lim[1], nome: f.slice(i + 1) }; });
function heartSoma(v) {
  var faltam = HEART.filter(function (k) { return v[k] == null; }).length;
  var total = HEART.reduce(function (s, k) { return s + Math.max(v[k] || 0, 0); }, 0);
  // T = -1: laudo só positivo/negativo — não pontua e o escore não fecha (revisão adversarial de 24/09)
  var semValor = v.t === -1;
  var faixa = faltam || semValor ? null : FAIXAS.filter(function (f) { return total >= f.de && total <= f.ate; })[0] || null;
  return { total: total, faltam: faltam, faixa: faixa, semValor: semValor,
           cartao: faixa ? (FAIXAS.indexOf(faixa) === 0 ? 'CX-A5' : 'CX-A6') : null };
}
function heartResumo(s) {
  return '<span class="hn">' + (s.semValor && !s.faltam ? '—' : s.total) + '</span><span class="hx">' + (s.faltam
    ? 'Toque um valor em cada linha — falta' + (s.faltam > 1 ? 'm ' : ' ') + s.faltam + '.'
    : s.semValor ? esc(CX['CX-A4'].heart_sem_valor)
    : '<b>' + esc(s.faixa ? s.faixa.nome : 'fora das faixas') + '</b> ' + esc(CX['CX-A4'].heart_desfecho) + '.' +
      (s.cartao === 'CX-A5' ? ' Alta só se: ' + esc(CX['CX-A5'].a3) : ' Conduta no cartão marcado abaixo.')) + '</span>';
}
var hv = {};
function heartTela() {
  hv = {};
  var a4 = CX['CX-A4'];
  var linhas = HEART.map(function (k) {
    var p = String(a4['heart_' + k]).split('|').map(function (x) { return x.trim(); });
    return '<div class="hitem"><div class="hrot"><b>' + k.toUpperCase() + '</b>' + esc(p[0]) + '</div>' +
      '<div class="hops" role="radiogroup" aria-label="' + esc(p[0]) + '" style="grid-template-columns:repeat(' + (p.length - 1) + ',1fr)">' +
      p.slice(1).map(function (t, v) {
        var val = v < 3 ? v : -1;          // 4ª opção (só no T): laudo sem valor
        return '<button type="button" class="hop" role="radio" aria-checked="false" data-k="' + k + '" data-v="' + val + '"><b>' +
          (val < 0 ? '—' : v) + '</b>' + esc(t) + '</button>';
      }).join('') + '</div>' + (k === 'r' ? '<p class="hnota">Fatores: ' + esc(a4.heart_fatores) + '</p>' : '') + '</div>';
  }).join('');
  return '<h2>Escore HEART</h2><p class="sub">' + esc(a4.heart_quando) + '</p>' +
    '<div class="htotal" id="htotal" aria-live="polite">' + heartResumo(heartSoma(hv)) + '</div>' +
    '<div class="calc" data-cx="CX-A4">' + linhas + '<button type="button" class="btn claro" id="hzera">Zerar</button>' +
    '<div class="fonte">Fonte: ' + esc(a4.fonte) + '</div></div>' + card(CX['CX-A5']) + card(CX['CX-A6']);
}
function ligaHeart() {
  var box = document.querySelector('.calc'); if (!box) return;
  box.onclick = function (e) {
    var b = e.target.closest && e.target.closest('.hop');
    if (b) {
      hv[b.getAttribute('data-k')] = +b.getAttribute('data-v');
      box.querySelectorAll('.hop[data-k="' + b.getAttribute('data-k') + '"]').forEach(function (o) { o.setAttribute('aria-checked', o === b ? 'true' : 'false'); });
    } else if (e.target.id === 'hzera') {
      hv = {}; box.querySelectorAll('.hop').forEach(function (o) { o.setAttribute('aria-checked', 'false'); });
    } else return;
    var s = heartSoma(hv); $('#htotal').innerHTML = heartResumo(s);
    ['CX-A5', 'CX-A6'].forEach(function (i) { var c = document.querySelector('.card[data-cx="' + i + '"]'); if (c) c.classList.toggle('foco', i === s.cartao); });
  };
}

/* ---------- Revisar: sugestões, perguntas em aberto e percepção. O texto só sai do aparelho quando a pessoa toca
   Enviar (POST ao Apps Script do projeto). Nada é gravado no aparelho: rascunhos vivem na memória desta aba. */
/* Filtro de dado de paciente — o MESMO código roda no app (antes de enviar) e no backend (antes de gravar).

   sendo a proteção principal. ES5 puro (roda no Apps Script). Casos de teste em testa_canal.js (portão G30). */
var EPONIMOS_CLINICOS = ['Killip', 'Sgarbossa', 'Wellens', 'Winter', 'Aslanger', 'Manchester', 'Grace', 'Heart', 'Levine', 'Boerhaave',

var NAO_NOMES = ['Homem', 'Homens', 'Mulher', 'Mulheres', 'Pacientes', 'Idosos', 'Idade', 'Acima', 'Abaixo', 'Menos', 'Mais'];
function pareceDadoDePaciente(texto) {
  var t = String(texto || ''), m;
  if (/\b\d{3}\.\d{3}\.\d{3}-?\d{2}\b/.test(t)) return 'um número no formato de CPF';
  if (/\b\d{3}\s\d{3}\s\d{3}[\s-]?\d{2}\b/.test(t)) return 'um número no formato de CPF (com espaços)';
  if (/\b\d{3}\s\d{4}\s\d{4}\s\d{4}\b/.test(t)) return 'um número no formato do cartão SUS';
  if (/\d{7,}/.test(t)) return 'um número longo sem separador (prontuário, CPF, cartão SUS)';
  if (/\b\d{1,2}[\/.\-]\d{1,2}[\/.\-](19\d\d|20[01]\d)\b/.test(t)) return 'uma data com ano de nascimento';
  if (/\b\d{1,2}\/\d{1,2}\/[3-9]\d\b/.test(t)) return 'uma data com ano de nascimento (2 dígitos)';
  if (/nascid[oa]s?\b|\bnasceu\b/i.test(t)) return 'uma data de nascimento ("nascido(a)", "nasceu")';
  if (/prontu[aá]rio\s*(n[ºo°.]?|#|:)?\s*\d/i.test(t)) return 'um número de prontuário';
  if (/\bnome\s*(d[oa]\s+paciente)?\s*[:=]/i.test(t)) return '"nome:" seguido de um nome';
  if (/\b9\d{4}[\s-]?\d{4}\b/.test(t)) return 'um número de celular';
  var ri = /\b([A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-zà-ÿ]{2,}),?\s+\d{1,3}\s*(?:anos|a)\b/g;
  while ((m = ri.exec(t))) if (NAO_NOMES.indexOf(m[1]) < 0) return 'um nome seguido de idade';
  var re = /\b(?:paciente|pcte|pac\.)\s+(?:sr\.?|sra\.?|dona|seu)?\s*([A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-zà-ÿ]{2,})/g;
  while ((m = re.exec(t))) if (EPONIMOS_CLINICOS.indexOf(m[1]) < 0) return '"paciente" seguido de um nome';
  if (/\b(Sr|Sra|Dona|Seu)\.?\s+[A-ZÁÉÍÓÚÂÊÔÃÕÇ][a-zà-ÿ]{2,}/.test(t)) return 'um tratamento seguido de nome (Sr., Sra., Dona, Seu)';
  if (/\b[A-Z]\.\s?[A-Z]\.(\s?[A-Z]\.)?(?![A-Za-z])/.test(t)) return 'iniciais de nome (ex.: J.S.M.)';
  return null;
}
var CANAL = D.canal, PERG = D.perguntas;

function chips(lista, attr, alvo, atual, rotulo) {

function ligaRevisar(arg) {

  if (!t.querySelector('#rnome')) return;
  t.oninput = function (e) {
    var x = e.target;
    if (x.id === 'rnome') rev.nome = x.value; else if (x.getAttribute('data-k')) rev.rascunho[x.getAttribute('data-k')] = x.value;
  };
  t.onclick = function (e) {
    var b = e.target.closest && e.target.closest('button'); if (!b) return;
    var marca = function () { b.parentNode.querySelectorAll('button').forEach(function (o) { o.setAttribute('aria-checked', o === b ? 'true' : 'false'); }); };
    if (b.hasAttribute('data-p')) { rev.papel = b.getAttribute('data-p'); marca(); }
    else if (b.hasAttribute('data-av')) { rev.aval[b.getAttribute('data-q')] = b.getAttribute('data-av'); marca(); }
    else if (b.hasAttribute('data-como')) { rev.como[b.getAttribute('data-q')] = b.getAttribute('data-como'); marca(); }
    else if (b.hasAttribute('data-nota')) { rev.nota[b.getAttribute('data-nota')] = +b.getAttribute('data-v'); marca(); }
    else if (b.hasAttribute('data-envia')) envia(b);
  };
  var q = arg && document.getElementById('q-' + arg) || (arg && CX[arg] && $('#sugestao'));
  if (q) setTimeout(function () { q.scrollIntoView({ block: 'start' }); }, 0);

/* monta o que vai para a planilha; devolve {erro} se não pode ir */
function pedido(tipo, alvo) {
  var k = tipo + ':' + alvo, texto = String(rev.rascunho[k] || '').trim(), aval = '';
  if (tipo === 'resposta') aval = rev.aval[alvo] || '';
  if (tipo === 'percepcao') {
    var notas = CANAL.percepcao.filter(function (d) { return rev.nota[d]; }).map(function (d) { return d + ' ' + rev.nota[d]; });
    if (!notas.length) return { erro: 'Toque uma nota em pelo menos um item.' };
    texto = notas.join(' · ') + (texto ? ' · comentário: ' + texto : '');
  }
  if (!CANAL.url) return { erro: 'Envio ainda não ligado nesta versão — nada foi enviado.' };
  if (!rev.papel) return { erro: 'Toque em "Quem é você?" lá em cima antes de enviar.' };
  if (!texto && !aval) return { erro: tipo === 'sugestao' ? 'Escreva a sugestão.' : 'Toque uma avaliação ou escreva a resposta.' };
  var d = pareceDadoDePaciente(texto);
  if (d) return { erro: 'Não enviado: o texto parece ter ' + d + '. Tire isso e envie de novo.' };
  return { corpo: { tipo: tipo, alvo: alvo, avaliacao: aval, como_sabe: tipo === 'resposta' ? (rev.como[alvo] || '') : '', papel: rev.papel,
                    nome: String(rev.nome || '').trim(), texto: texto, versao: VERSAO_APP } };
}
function envia(b) {
  var tipo = b.getAttribute('data-envia'), alvo = b.getAttribute('data-alvo'), est = b.nextElementSibling;
  var diz = function (msg, cls) { est.textContent = msg; est.className = 'estado-envio ' + (cls || ''); };
  var p = pedido(tipo, alvo);
  if (p.erro) return diz(p.erro, 'erro');
  b.disabled = true; diz('Enviando…');
  enviar(p.corpo).then(function (r) {
    if (r && r.ok) {
      rev.enviado[tipo + ':' + alvo] = true; rev.rascunho[tipo + ':' + alvo] = '';
      var ta = b.previousElementSibling; if (ta && ta.tagName === 'TEXTAREA') ta.value = '';
      diz('✓ Enviado. Obrigado — a equipe do PIEPE vai ler.', 'ok');
    } else diz('Não enviado: ' + ((r && r.erro) || 'resposta estranha do servidor') + '. O texto continua aqui.', 'erro');
  }, function () { diz('Não enviado (sem internet ou sinal fraco). O texto continua aqui: toque Enviar de novo quando tiver sinal.', 'erro'); })
    .then(function () { b.disabled = false; });

/* Mesmo padrão do app de coleta: text/plain (sem preflight), segue o redirect do Apps Script, prazo de 12 s —
   sem prazo, wi-fi com portal cativo deixava o botão em "enviando" para sempre. */
function enviar(corpo) {
  var ac = window.AbortController ? new AbortController() : null;
  var prazo = setTimeout(function () { if (ac) ac.abort(); }, 12000);
  return fetch(CANAL.url, { method: 'POST', redirect: 'follow', signal: ac ? ac.signal : undefined,
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) })
    .then(function (r) { return r.text(); })
    .then(function (x) { clearTimeout(prazo); try { return JSON.parse(x); } catch (e) { return { ok: false, erro: 'resposta estranha do servidor' }; } },
          function (e) { clearTimeout(prazo); throw e; });
}

function rota() { var p = (location.hash.replace(/^#\/?/, '') || 'inicio').split('/'); return { nome: p[0], arg: decodeURIComponent(p[1] || '') }; }

/* ---------- instalar: Android pelo evento do navegador; iPhone não tem prompt — mostra o passo a passo */
var adiado = null;
var ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function instalarCartao(soSeNovo) {

window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); adiado = e; refazInstalar(); });
window.addEventListener('appinstalled', function () { instalado = true; refazInstalar(); });

/* ---------- offline: abre do cache na hora; se houver versão nova, avisa (o protocolo validado tem de chegar) */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    reg.addEventListener('updatefound', function () {
      var w = reg.installing;
      w && w.addEventListener('statechange', function () {
        /* Só é "versão nova" se quem controlava a página era o NOSSO sw.js. No GitHub Pages a origem é a do
           app N1, e na 1ª visita de quem tem o N1 instalado o controlador é o sw do N1 — o aviso aparecia
           numa instalação nova. Medido no ar em 24/09; G32. */

        if (w.state === 'installed' && antes && antes.scriptURL === new URL('sw.js', location.href).href) $('#novo').style.display = 'flex';
